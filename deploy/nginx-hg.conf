# 有域名 + HTTPS 时用（可选）。没有域名就 http://IP:8080 直接用，不需要这个文件。
#
# 用法：Caddy（自动证书，最省事）
#   your.domain.com {
#       encode gzip
#       handle /api/*   { reverse_proxy 127.0.0.1:8080 }
#       handle /media/* { reverse_proxy 127.0.0.1:8080 }
#       handle /img     { reverse_proxy 127.0.0.1:8080 }
#       handle          { reverse_proxy 127.0.0.1:8080 }
#   }
#
# 下面是 Nginx 版本：certbot 申请证书后把 443 段打开。

server {
    listen 80;
    server_name your.domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your.domain.com;

    ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;

    client_max_body_size 4m;

    # 分片/密钥：不要缓冲，直接透传（拖动进度条更顺）
    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /img {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;   # 网关自己托管前端 dist
        proxy_set_header Host $host;
    }
}
