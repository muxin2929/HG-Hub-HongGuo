# 前端容器：静态文件 + 把内容源请求转给 gateway
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ { proxy_pass http://gateway:8080; proxy_set_header Host $host; proxy_read_timeout 60s; }
    location /media/ { proxy_pass http://gateway:8080; proxy_set_header Host $host; proxy_buffering off; }
    location /img { proxy_pass http://gateway:8080; proxy_set_header Host $host; }

    # index.html 不缓存，带 hash 的静态资源长缓存
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=604800"; }
}
